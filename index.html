<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Micro:bit Controller</title>
    <!-- โหลด Teachable Machine & TensorFlow.js Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.3/dist/teachablemachine-image.min.js"></script>
    
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background-color: #f0f2f5; 
            margin: 0; 
            padding: 20px; 
        }
        .card { 
            background: white; 
            max-width: 500px; 
            margin: 0 auto; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
        }
        h1 { color: #333; font-size: 1.5rem; margin-bottom: 15px; }
        input[type="text"] { 
            width: 80%; 
            padding: 10px; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            margin-bottom: 10px; 
        }
        button { 
            padding: 10px 16px; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            margin: 5px; 
            transition: 0.2s; 
        }
        .btn-blue { background-color: #007bff; color: white; }
        .btn-green { background-color: #28a745; color: white; }
        .btn-red { background-color: #dc3545; color: white; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
        #webcam-container { margin: 15px 0; min-height: 200px; }
        #webcam-container canvas { border-radius: 8px; border: 2px solid #ddd; }
        #label-container { text-align: left; background: #fafafa; padding: 10px; border-radius: 6px; border: 1px solid #eee; }
        .label-row { margin: 5px 0; font-weight: 500; }
        .status-box { padding: 10px; margin-top: 15px; border-radius: 6px; font-size: 0.9rem; font-weight: bold; }
        .connected { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .disconnected { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="card">
    <h1>🤖 AI Micro:bit Controller</h1>
    <h2>Danaisak Karo</h2>
    <!-- 1. ส่วนใส่ลิงก์โมเดล -->
    <div>
        <input type="text" id="model-url" placeholder="วาง URL ของ Teachable Machine ที่นี่...">
        <br>
        <button class="btn-blue" onclick="initAI()">1. โหลดโมเดล & เปิดกล้อง</button>
    </div>

    <!-- 2. แสดงภาพจากกล้อง -->
    <div id="webcam-container"></div>

    <!-- 3. ส่วน Bluetooth เชื่อมต่อ micro:bit -->
    <div>
        <button id="btn-connect" class="btn-green" onclick="connectBluetooth()" disabled>2. เชื่อมต่อ micro:bit</button>
        <button id="btn-disconnect" class="btn-red" onclick="disconnectBluetooth()" style="display:none;">ตัดการเชื่อมต่อ</button>
    </div>

    <!-- 4. แสดงสถานะการเชื่อมต่อ -->
    <div id="status" class="status-box disconnected">สถานะ: ยังไม่ได้เชื่อมต่อ micro:bit</div>

    <!-- 5. แสดงผลเปอร์เซ็นต์ความน่าจะเป็น -->
    <h3 style="margin-top:20px; text-align:left;">ผลการทำนาย (Prediction):</h3>
    <div id="label-container"></div>
</div>

<script>
    // UUIDs สำหรับ Bluetooth UART บน micro:bit
    const UART_SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
    // ช่อง RX (0003) สำหรับเขียน/ส่งข้อมูล (Write) เข้าไปยัง micro:bit
    const UART_RX_CHARACTERISTIC_UUID = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';

    let model, webcam, labelContainer, maxPredictions;
    let bluetoothDevice, rxCharacteristic;
    let lastSentClass = "";

    // 1. โหลดโมเดล AI และเปิดใช้งานกล้อง Webcam
    async function initAI() {
        let URL = document.getElementById("model-url").value.trim();
        if (!URL) {
            alert("กรุณาใส่ Link Model จาก Teachable Machine ก่อนครับ!");
            return;
        }

        // ตรวจสอบความถูกต้องของ URL
        if (!URL.endsWith("/")) {
            URL += "/";
        }

        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";

        try {
            document.getElementById("status").innerText = "กำลังโหลดโมเดล AI...";
            
            // โหลดโมเดล
            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            // ตั้งค่ากล้อง Webcam
            const flip = true; 
            webcam = new tmImage.Webcam(280, 280, flip); 
            await webcam.setup(); 
            await webcam.play();
            window.requestAnimationFrame(loop);

            // แสดงภาพกล้องบนหน้าเว็บ
            document.getElementById("webcam-container").innerHTML = "";
            document.getElementById("webcam-container").appendChild(webcam.canvas);

            // สร้าง Element สำหรับแสดงผลเปอร์เซ็นต์
            labelContainer = document.getElementById("label-container");
            labelContainer.innerHTML = "";
            for (let i = 0; i < maxPredictions; i++) {
                labelContainer.appendChild(document.createElement("div"));
            }

            // เปิดให้กดปุ่มเชื่อมต่อ Bluetooth ได้
            document.getElementById("btn-connect").disabled = false;
            document.getElementById("status").innerText = "โหลดโมเดลสำเร็จ! พร้อมเชื่อมต่อ micro:bit";
            document.getElementById("status").className = "status-box disconnected";
        } catch (e) {
            alert("ไม่สามารถโหลดโมเดลได้ กรุณาตรวจสอบ URL ให้ถูกต้อง");
            console.error(e);
            document.getElementById("status").innerText = "เกิดข้อผิดพลาดในการโหลดโมเดล";
        }
    }

    // ลูปประมวลผลภาพกล้องแบบ Real-time
    async function loop() {
        webcam.update();
        await predict();
        window.requestAnimationFrame(loop);
    }

    // ทำนายผลภาพ และส่งค่าเข้า micro:bit
    async function predict() {
        if (!model) return;

        const prediction = await model.predict(webcam.canvas);
        let highestProb = 0;
        let bestClass = "";

        for (let i = 0; i < maxPredictions; i++) {
            const className = prediction[i].className;
            const prob = prediction[i].probability;

            // แสดงเปอร์เซ็นต์บนหน้าจอ
            labelContainer.childNodes[i].innerHTML = 
                `<div class="label-row"><b>${className}:</b> ${(prob * 100).toFixed(0)}%</div>`;

            // หา Class ที่มีเปอร์เซ็นต์ความมั่นใจสูงที่สุด
            if (prob > highestProb) {
                highestProb = prob;
                bestClass = className;
            }
        }

        // ส่งข้อความเข้า micro:bit เมื่อคลาสเปลี่ยน และความมั่นใจ > 75%
        if (bestClass !== lastSentClass && highestProb > 0.75) {
            sendDataToMicrobit(bestClass);
            lastSentClass = bestClass;
        }
    }

    // 2. เชื่อมต่อ Web Bluetooth เข้ากับ micro:bit
    async function connectBluetooth() {
        try {
            document.getElementById("status").innerText = "กำลังค้นหาอุปกรณ์ micro:bit...";
            
            // สแกนหาอุปกรณ์โดยใช้ UART Service UUID
            bluetoothDevice = await navigator.bluetooth.requestDevice({
                filters: [
                    { services: [UART_SERVICE_UUID] },
                    { namePrefix: 'micro:bit' },
                    { namePrefix: 'BBC micro:bit' }
                ],
                optionalServices: [UART_SERVICE_UUID]
            });

            document.getElementById("status").innerText = "กำลังเชื่อมต่อกับ " + bluetoothDevice.name + "...";

            const server = await bluetoothDevice.gatt.connect();
            const service = await server.getPrimaryService(UART_SERVICE_UUID);
            
            // ดึง RX Characteristic (0003) สำหรับ Write ข้อมูล
            rxCharacteristic = await service.getCharacteristic(UART_RX_CHARACTERISTIC_UUID);

            // อัปเดตสถานะหน้าเว็บ
            document.getElementById("status").innerText = "สถานะ: เชื่อมต่อสำเร็จกับ " + bluetoothDevice.name;
            document.getElementById("status").className = "status-box connected";
            document.getElementById("btn-connect").style.display = "none";
            document.getElementById("btn-disconnect").style.display = "inline-block";

            // เมื่อการเชื่อมต่อบลูทูธหลุด
            bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

        } catch (error) {
            console.error(error);
            document.getElementById("status").innerText = "สถานะ: เชื่อมต่อไม่สำเร็จ (" + error.message + ")";
            document.getElementById("status").className = "status-box disconnected";
        }
    }

    // ฟังก์ชันส่งข้อความ (String) ไปยัง micro:bit
    async function sendDataToMicrobit(data) {
        if (rxCharacteristic) {
            try {
                // เติม \n ต่อท้ายเพื่อบอกจุดสิ้นสุดของข้อความ
                let encoder = new TextEncoder('utf-8');
                await rxCharacteristic.writeValue(encoder.encode(data + "\n"));
                console.log("ส่งข้อมูลสำเร็จ:", data);
            } catch (error) {
                console.error("ส่งข้อมูลล้มเหลว:", error.message);
            }
        }
    }

    // ตัดการเชื่อมต่อ Bluetooth
    function disconnectBluetooth() {
        if (bluetoothDevice && bluetoothDevice.gatt.connected) {
            bluetoothDevice.gatt.disconnect();
        }
    }

    function onDisconnected() {
        document.getElementById("status").innerText = "สถานะ: ตัดการเชื่อมต่อแล้ว";
        document.getElementById("status").className = "status-box disconnected";
        document.getElementById("btn-connect").style.display = "inline-block";
        document.getElementById("btn-disconnect").style.display = "none";
        rxCharacteristic = null;
    }
</script>

</body>
</html>
