<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AI Micro:bit Controller</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.3/dist/teachablemachine-image.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background-color: #f0f2f5; margin: 0; padding: 20px; }
        .card { background: white; max-width: 500px; margin: 0 auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #333; font-size: 1.5rem; margin-bottom: 15px; }
        input[type="text"] { width: 80%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 10px; }
        button { padding: 10px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin: 5px; transition: 0.2s; }
        .btn-blue { background-color: #007bff; color: white; }
        .btn-green { background-color: #28a745; color: white; }
        .btn-red { background-color: #dc3545; color: white; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
        #webcam-container { margin: 15px 0; min-height: 200px; }
        #webcam-container canvas { border-radius: 8px; border: 2px solid #ddd; }
        #label-container { text-align: left; background: #fafafa; padding: 10px; border-radius: 6px; border: 1px solid #eee; }
        .label-row { margin: 5px 0; font-weight: 500; }
        .status-box { padding: 8px; margin-top: 10px; border-radius: 6px; font-size: 0.9rem; }
        .connected { background-color: #d4edda; color: #155724; }
        .disconnected { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div class="card">
    <h1>🤖 AI Micro:bit Controller</h1>
    
    <div>
        <input type="text" id="model-url" placeholder="วางลิงก์ Teachable Machine Model URL ที่นี่...">
        <br>
        <button class="btn-blue" onclick="initAI()">1. โหลดโมเดล & เปิดกล้อง</button>
    </div>

    <div id="webcam-container"></div>

    <div>
        <button id="btn-connect" class="btn-green" onclick="connectBluetooth()" disabled>2. เชื่อมต่อ micro:bit</button>
        <button id="btn-disconnect" class="btn-red" onclick="disconnectBluetooth()" style="display:none;">ตัดการเชื่อมต่อ</button>
    </div>

    <div id="status" class="status-box disconnected">สถานะ: ยังไม่ได้เชื่อมต่อ micro:bit</div>

    <h3 style="margin-top:20px; text-align:left;">ผลการทำนาย (Prediction):</h3>
    <div id="label-container"></div>
</div>

<script>
    // UUIDs มาตรฐานของ Bluetooth UART Service บน micro:bit
    const UART_SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
    const UART_TX_CHARACTERISTIC_UUID = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';

    let model, webcam, labelContainer, maxPredictions;
    let bluetoothDevice, txCharacteristic;
    let lastSentClass = "";

    // 1. โหลดโมเดล AI และเปิดใช้งาน กล้อง
    async function initAI() {
        const URL = document.getElementById("model-url").value.trim();
        if (!URL) {
            alert("กรุณาใส่ Link Model จาก Teachable Machine ก่อนครับ!");
            return;
        }

        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";

        try {
            // โหลดโมเดล
            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            // ตั้งค่ากล้อง Webcam
            const flip = true; 
            webcam = new tmImage.Webcam(280, 280, flip); 
            await webcam.setup(); 
            await webcam.play();
            window.requestAnimationFrame(loop);

            // แสดงผลกล้องในเว็บ
            document.getElementById("webcam-container").innerHTML = "";
            document.getElementById("webcam-container").appendChild(webcam.canvas);

            // สร้าง Element สำหรับแสดงค่าเปอร์เซ็นต์
            labelContainer = document.getElementById("label-container");
            labelContainer.innerHTML = "";
            for (let i = 0; i < maxPredictions; i++) {
                labelContainer.appendChild(document.createElement("div"));
            }

            // เปิดให้กดปุ่ม Bluetooth ได้
            document.getElementById("btn-connect").disabled = false;
            alert("โหลดโมเดลสำเร็จแล้ว! กดปุ่มเชื่อมต่อ micro:bit ต่อได้เลย");
        } catch (e) {
            alert("ไม่สามารถโหลดโมเดลได้ กรุณาตรวจสอบ URL ให้ถูกต้อง");
            console.error(e);
        }
    }

    // ลูปประมวลผลกล้องแบบ Real-time
    async function loop() {
        webcam.update();
        await predict();
        window.requestAnimationFrame(loop);
    }

    // ทายผลภาพและส่งค่าเข้า micro:bit
    async function predict() {
        const prediction = await model.predict(webcam.canvas);
        let highestProb = 0;
        let bestClass = "";

        for (let i = 0; i < maxPredictions; i++) {
            const className = prediction[i].className;
            const prob = prediction[i].probability;

            // อัปเดตหน้าจอเปอร์เซ็นต์
            labelContainer.childNodes[i].innerHTML = 
                `<div class="label-row"><b>${className}:</b> ${(prob * 100).toFixed(0)}%</div>`;

            // หา Class ที่มีเปอร์เซ็นต์ความมั่นใจสูงที่สุด
            if (prob > highestProb) {
                highestProb = prob;
                bestClass = className;
            }
        }

        // ส่งข้อมูลเข้า micro:bit เฉพาะเมื่อค่าเปลี่ยน และความมั่นใจ > 75%
        if (bestClass !== lastSentClass && highestProb > 0.75) {
            sendDataToMicrobit(bestClass);
            lastSentClass = bestClass;
        }
    }

    // 2. เชื่อมต่อ Web Bluetooth เข้ากับ micro:bit
    async function connectBluetooth() {
        try {
            document.getElementById("status").innerText = "กำลังค้นหาอุปกรณ์ micro:bit...";
            
            // สแกนหาอุปกรณ์ที่มี UART Service
            bluetoothDevice = await navigator.bluetooth.requestDevice({
                filters: [{ namePrefix: 'micro:bit' }],
                optionalServices: [UART_SERVICE_UUID]
            });

            const server = await bluetoothDevice.gatt.connect();
            const service = await server.getPrimaryService(UART_SERVICE_UUID);
            txCharacteristic = await service.getCharacteristic(UART_TX_CHARACTERISTIC_UUID);

            // อัปเดตสถานะหน้าเว็บ
            document.getElementById("status").innerText = "สถานะ: เชื่อมต่อสำเร็จกับ " + bluetoothDevice.name;
            document.getElementById("status").className = "status-box connected";
            document.getElementById("btn-connect").style.display = "none";
            document.getElementById("btn-disconnect").style.display = "inline-block";

            // เมื่อบลูทูธหลุด
            bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

        } catch (error) {
            console.error(error);
            document.getElementById("status").innerText = "สถานะ: เชื่อมต่อไม่สำเร็จ (" + error + ")";
            document.getElementById("status").className = "status-box disconnected";
        }
    }

    // ฟังก์ชันส่งข้อความ (Text String) ไปหา micro:bit
    async function sendDataToMicrobit(data) {
        if (txCharacteristic) {
            try {
                // เติม \n ต่อท้ายเพื่อบอกจุดสิ้นสุดของข้อความ
                let encoder = new TextEncoder('utf-8');
                await txCharacteristic.writeValue(encoder.encode(data + "\n"));
                console.log("ส่งข้อมูลสำเร็จ:", data);
            } catch (error) {
                console.error("ส่งข้อมูลล้มเหลว:", error);
            }
        }
    }

    // ตัดการเชื่อมต่อ Bluetooth
    function disconnectBluetooth() {
        if (bluetoothDevice && bluetoothDevice.gatt.connected) {
            bluetoothDevice.gatt.disconnect();
        }
    }

    function onDisconnected() {
        document.getElementById("status").innerText = "สถานะ: ตัดการเชื่อมต่อแล้ว";
        document.getElementById("status").className = "status-box disconnected";
        document.getElementById("btn-connect").style.display = "inline-block";
        document.getElementById("btn-disconnect").style.display = "none";
        txCharacteristic = null;
    }
</script>

</body>
</html>
